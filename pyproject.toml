[project]
name = "trading-engine"
version = "0.1.0"
description = "Motor de trading algoritmico - fase backtesting-first (capa de ingesta)"
requires-python = ">=3.11"
dependencies = [
    "ccxt>=4.3",
    "pydantic>=2.6",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
    "python-dotenv>=1.0",
    "pandas>=2.2",
    "pandas-ta>=0.4.71b0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
fetch-historical = "trading_engine.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trading_engine"]

[tool.pytest.ini_options]
pythonpath = ["src"]

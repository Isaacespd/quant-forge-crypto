services:
  db:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: trading
      POSTGRES_PASSWORD: trading
      POSTGRES_DB: trading_engine
    ports:
      # 55432 en el host: 5432 y 5433 ya están tomados por instancias nativas de
      # PostgreSQL en esta máquina (verificado con Get-NetTCPConnection).
      - "55432:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data

volumes:
  timescale_data:
